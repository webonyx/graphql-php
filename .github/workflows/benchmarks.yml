name: Benchmarks

on:
  pull_request:
    paths:
      - .github/workflows/benchmarks.yml
      - benchmarks/**
      - composer.json
      - src/**
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  benchmark-pr:
    name: Count benchmark instructions
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          path: head
          fetch-depth: 2

      - id: base-sha
        run: echo "sha=$(git -C head rev-parse HEAD^1)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.base-sha.outputs.sha }}
          path: base

      - uses: shivammathur/setup-php@v2
        with:
          coverage: none
          php-version: "8.3"

      - uses: ramsey/composer-install@v4
        with:
          working-directory: base

      - uses: ramsey/composer-install@v4
        with:
          working-directory: head

      - run: sudo apt-get install --yes valgrind

      - name: Count instructions on base and head
        run: |
          php head/benchmarks/count-instructions.php base > base.json &
          base_pid=$!
          php head/benchmarks/count-instructions.php head > head.json
          wait "$base_pid"

      - name: Compare results
        shell: bash
        run: php head/benchmarks/compare-results.php base.json head.json | tee --append "$GITHUB_STEP_SUMMARY"

  benchmark-history:
    name: Track benchmark history
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          coverage: none
          php-version: "8.3"

      - uses: ramsey/composer-install@v4

      - name: Run PHPBench
        run: |
          php -d zend.assertions=-1 vendor/bin/phpbench run \
            --progress=none \
            --dump-file=benchmark.xml

      - name: Convert results
        run: php benchmarks/convert-results.php benchmark.xml > benchmark-results.json

      - uses: benchmark-action/github-action-benchmark@v1
        if: github.repository == 'webonyx/graphql-php'
        with:
          tool: customSmallerIsBetter
          output-file-path: benchmark-results.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ github.ref == 'refs/heads/master' }}
          gh-pages-branch: benchmark-results
          benchmark-data-dir-path: dev/bench
          alert-threshold: '150%'
          # TODO: switch to true once baseline variance is understood
          fail-on-alert: false
          comment-on-alert: false
          comment-always: false
